name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --locked --group dev
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}
      - run: uv sync --locked --group dev
      # The default run is the full capture tier: every row captured from Excel, plus the
      # doctests of the README and the documentation pages.
      - run: uv run pytest

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: uv sync --locked --group docs
      # -n reports unresolved references, -W makes every warning an error.
      - run: uv run --group docs sphinx-build -n -W --keep-going docs docs/_build/html
      - run: npx --yes pagefind@1.5.2 --site docs/_build/html
      - uses: actions/upload-artifact@v4
        with:
          name: docs-html
          path: docs/_build/html/

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv build
      - run: uvx twine check --strict dist/*
      # Each artifact must install alone, with no development tools, and import.
      - name: Install the wheel into a clean environment
        run: |
          uv venv /tmp/wheel-env
          uv pip install -p /tmp/wheel-env dist/*.whl
          /tmp/wheel-env/bin/python -I -c "import xlformat; print(xlformat.__version__)"
      - name: Install the sdist into a clean environment and run its tests
        run: |
          uv venv /tmp/sdist-env
          uv pip install -p /tmp/sdist-env dist/*.tar.gz pytest
          mkdir /tmp/sdist && tar xzf dist/*.tar.gz -C /tmp/sdist
          cd /tmp/sdist/xlformat-*/ && /tmp/sdist-env/bin/python -m pytest -q
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
